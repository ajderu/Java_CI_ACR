#name: $(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
    - main
    - releases/*
    - feature/*
    exclude:
    - releases/old*
    - feature/*-working
  paths:
    include:
    - docs/*.md
    
resources:
- repo: self

variables:
- name: imageRepo
  value: innovation-center-semver
- name: serviceConnection
  value: Innovation_AKS
- name: DOCKER_REGISTRY
  value: volpayacr.azurecr.io
- name: dockerRegistryServiceConnection
  value: Innovation_ACR


pool:
  vmImage: ubuntu-latest

stages:
  - stage: 'BuildGoPipeline'
    displayName: Build Go Pipeline
    jobs:
    - job: 'BuildGo'
      displayName: Build Go Pipeline
      steps:
      - checkout: self
        fetchDepth: 0
      - task: gitversion/setup@0
        inputs:
          versionSpec: '5.x'
      - task: Bash@3
        inputs:
          targetType: 'inline'
          script: 'dotnet-gitversion version'     
      - task: gitversion/execute@0
        inputs:
          useConfigFile: true
          configFilePath: '.azuredevops/GitVersion.yml'
      - script: echo current version is $(GitVersion.SemVer)
        displayName: 'Display calculated version'      
      - task: Bash@3
        displayName: 'Update build number'
        inputs:
          targetType: inline
          script: echo "##vso[build.updatebuildnumber]$(SemVer)"
          #script: echo "##vso[build.updatebuildnumber]$(imageRepo)_$(SemVer)"
      - task: GoTool@0
        displayName: Download Go version
        inputs:
          version: '1.19.3'
      - task: Go@0
        displayName: go get
        inputs:
          command: 'get'
          arguments: '-d'
          workingDirectory: '$(System.DefaultWorkingDirectory)'
      - task: Go@0
        displayName: go build
        inputs:
          command: 'build'
          arguments: '$(System.DefaultWorkingDirectory)'
      - task: CopyFiles@2
        inputs:
          TargetFolder: '$(Build.ArtifactStagingDirectory)'
      - task: PublishBuildArtifacts@1
        inputs:
          artifactName: drop
      - task: Go@0
        displayName: go test 
        inputs:
          command: 'test'
          arguments: '-v'
          workingDirectory: '$(System.DefaultWorkingDirectory)'
#added a new comment for semver testing

  - stage: 'BuildAndPushACR'
    displayName: BuildAndPushACR
    jobs:
    - job: 'BuildAndPushACR'
      displayName: Build and Push Docker Image  
      steps:
      - task: Docker@2
        displayName: Build and Push Docker Image
        inputs:
          containerRegistry: '$(dockerRegistryServiceConnection)'
          repository: '$(imageRepo)'
          command: 'buildAndPush'
          Dockerfile: '**/Dockerfile'
          tags: |
            $(Build.BuildNumber)
            latest
      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: '$(Pipeline.Workspace)/s/kubernetes'
          artifact: 'manifests'
          publishLocation: 'pipeline'
          
